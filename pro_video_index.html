<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCam Studio HD - Photo & Video</title>
    <style>
        :root {
            --bg-main: #0a0a0c;
            --bg-panel: #141419;
            --bg-surface: #1e1e24;
            --accent: #e5a93c; /* Pro Gold */
            --record-color: #ff453a; /* Recording Red */
            --text-main: #f1f1f3;
            --text-muted: #8e8e93;
            --border: #2c2c35;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        header h1::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
        }

        .status-badge {
            font-size: 0.75rem;
            background: var(--bg-surface);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid var(--border);
            color: var(--accent);
            font-family: monospace;
        }

        /* Mode Selector Tabs */
        .mode-selector {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 5px 10px;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .mode-btn.active {
            color: var(--text-main);
        }

        .mode-btn.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
        }

        /* Viewport Frame */
        .viewport-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        /* Overlays */
        .camera-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            z-index: 2;
        }

        .overlay-top {
            display: flex;
            justify-content: space-between;
            font-family: monospace;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.7);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        /* Recording Indicator */
        .rec-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--record-color);
            font-weight: bold;
            visibility: hidden;
        }

        .rec-dot {
            width: 10px;
            height: 10px;
            background: var(--record-color);
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .camera-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.2;
        }
        .camera-grid::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 33.33%; right: 33.33%;
            border-left: 1px solid #fff; border-right: 1px solid #fff;
        }
        .camera-grid::after {
            content: ''; position: absolute; left: 0; right: 0; top: 33.33%; bottom: 33.33%;
            border-top: 1px solid #fff; border-bottom: 1px solid #fff;
        }

        .flash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white; opacity: 0; pointer-events: none; z-index: 10;
        }
        @keyframes flash-trigger {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Controls */
        .control-panel {
            margin-top: 15px;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: block;
            font-weight: 600;
        }

        .filters-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: thin;
        }

        .filter-card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            min-width: 130px;
            transition: all 0.2s;
        }

        .filter-card.active {
            background: var(--accent);
            border-color: var(--accent);
        }
        .filter-card.active .f-name { color: #000; font-weight: 600; }
        .filter-card.active .f-desc { color: rgba(0,0,0,0.6); }

        .f-name { font-size: 0.85rem; color: var(--text-main); display: block; }
        .f-desc { font-size: 0.7rem; color: var(--text-muted); display: block; }

        .deck-actions {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 15px;
            margin-top: 15px;
        }

        .side-opt { display: flex; gap: 15px; }
        .side-opt.right { justify-content: flex-end; }

        .icon-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn.active {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Shutter/Record Core Button Layout */
        .shutter-wrapper { display: flex; justify-content: center; }
        
        .trigger-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #fff;
            border: 4px solid var(--bg-panel);
            box-shadow: 0 0 0 2px #fff, 0 10px 20px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        /* Dynamic states for Photo vs Video modes */
        .trigger-btn.video-mode {
            background: var(--record-color);
            box-shadow: 0 0 0 2px var(--record-color), 0 10px 20px rgba(0,0,0,0.4);
        }

        .trigger-btn.recording {
            border-radius: 8px;
            transform: scale(0.85);
            background: var(--record-color);
        }

        /* Camera Emulation Profiles CSS filters */
        .cam-normal { filter: none; }
        .cam-leica-m { filter: contrast(1.18) saturate(0.9) brightness(0.95); }
        .cam-fuji-chroma { filter: saturate(1.45) contrast(1.1) brightness(1.02); }
        .cam-fuji-classic { filter: sepia(0.12) contrast(1.05) saturate(0.85); }
        .cam-hasselblad { filter: contrast(1.03) saturate(1.02) brightness(1.02); }
        .cam-kodak-gold { filter: sepia(0.22) saturate(1.25) contrast(1.05); }
        .cam-cinestill { filter: hue-rotate(10deg) saturate(1.1) contrast(1.15); }
        .cam-ilford-pan { filter: grayscale(1) contrast(1.35); }
        .cam-polaroid-600 { filter: contrast(0.88) brightness(1.08) sepia(0.15); }
        .cam-sony-slog { filter: contrast(0.65) brightness(1.2) saturate(0.7); }

        @media(max-width: 680px) {
            .deck-actions { grid-template-columns: 1fr; gap: 15px; }
            .side-opt { justify-content: center !important; }
            .shutter-wrapper { order: -1; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>PRO_CAM STUDIO HD</h1>
            <div class="status-badge" id="resolutionDisplay">FHD MODE</div>
        </header>

        <!-- Mode Select (Photo / Video Toggle) -->
        <div class="mode-selector">
            <button class="mode-btn active" id="modePhotoBtn">PHOTO</button>
            <button class="mode-btn" id="modeVideoBtn">VIDEO</button>
        </div>

        <div class="viewport-wrapper">
            <div class="flash" id="flashOverlay"></div>
            <div class="camera-grid" id="gridLines"></div>
            
            <div class="camera-overlay">
                <div class="overlay-top">
                    <span id="hudFormat">RAW 14BIT</span>
                    <div class="rec-indicator" id="recIndicator">
                        <div class="rec-dot"></div>
                        <span id="timestamp">00:00</span>
                    </div>
                    <span>ISO AUTO</span>
                </div>
            </div>
            
            <video id="video" autoplay playsinline muted></video>
        </div>

        <div class="control-panel">
            <span class="section-title">Color Profile Emulation</span>
            <div class="filters-scroll" id="filtersScroll"></div>

            <div class="deck-actions">
                <div class="side-opt">
                    <button class="icon-btn active" id="gridToggleBtn">🏁 Grid</button>
                </div>
                
                <div class="shutter-wrapper">
                    <button class="trigger-btn" id="triggerBtn" title="Capture"></button>
                </div>

                <div class="side-opt right">
                    <button class="icon-btn" id="switchCamBtn">🔄 Lens Swap</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const triggerBtn = document.getElementById('triggerBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const gridToggleBtn = document.getElementById('gridToggleBtn');
        const modePhotoBtn = document.getElementById('modePhotoBtn');
        const modeVideoBtn = document.getElementById('modeVideoBtn');
        const filtersScroll = document.getElementById('filtersScroll');
        const flashOverlay = document.getElementById('flashOverlay');
        const gridLines = document.getElementById('gridLines');
        const recIndicator = document.getElementById('recIndicator');
        const timestamp = document.getElementById('timestamp');
        const resolutionDisplay = document.getElementById('resolutionDisplay');
        const hudFormat = document.getElementById('hudFormat');

        let currentStream = null;
        let isFrontCamera = false;
        let currentMode = 'photo'; // 'photo' or 'video'
        let isRecording = false;
        
        let mediaRecorder = null;
        let recordedChunks = [];
        let startTime = 0;
        let timerInterval = null;

        const cameraProfiles = [
            { name: 'Standard Raw', class: 'cam-normal', desc: 'True sensor bypass' },
            { name: 'Leica M-Chrome', class: 'cam-leica-m', desc: 'High contrast organic look' },
            { name: 'Fuji Velvia', class: 'cam-fuji-chroma', desc: 'Ultra-vivid landscapes' },
            { name: 'Fuji Classic', class: 'cam-fuji-classic', desc: 'Nostalgic documentary look' },
            { name: 'Hasselblad Natural', class: 'cam-hasselblad', desc: 'Micro-graded accuracy' },
            { name: 'Kodak Gold 200', class: 'cam-kodak-gold', desc: 'Warm analog retro grain' },
            { name: 'CineStill 800T', class: 'cam-cinestill', desc: 'Cinematic tungsten look' },
            { name: 'Ilford Pan F', class: 'cam-ilford-pan', desc: 'High dynamic monochrome' },
            { name: 'Polaroid 600', class: 'cam-polaroid-600', desc: 'Soft pastel vintage profile' },
            { name: 'Sony S-Log3', class: 'cam-sony-slog', desc: 'Flat dynamic range scale' }
        ];

        function renderProfiles() {
            filtersScroll.innerHTML = '';
            cameraProfiles.forEach((profile, index) => {
                const card = document.createElement('div');
                card.className = `filter-card ${index === 0 ? 'active' : ''}`;
                card.innerHTML = `<span class="f-name">${profile.name}</span><span class="f-desc">${profile.desc}</span>`;
                card.onclick = () => {
                    document.querySelectorAll('.filter-card').forEach(c => c.classList.remove('active'));
                    card.classList.add('active');
                    video.className = profile.class;
                };
                filtersScroll.appendChild(card);
            });
        }

        // Mechanical Shutter Beep & Record Sounds
        function playSound(type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'photo') {
                    // Crisp snap sound
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(1000, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'start') {
                    // Double high pitch pip
                    osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.08);
                } else if (type === 'stop') {
                    // Low tone warning drop
                    osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                }
            } catch(e) {}
        }

        async function initCamera() {
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            const constraints = {
                video: {
                    facingMode: isFrontCamera ? 'user' : 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: true // Enabled audio tracking so recordings have audio
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                video.onloadedmetadata = () => {
                    resolutionDisplay.innerText = `FHD ${video.videoWidth}x${video.videoHeight} [${currentMode.toUpperCase()}]`;
                };
            } catch (err) {
                // Secondary fallback if mic permission bugs out along with camera
                const videoOnlyConstraints = { video: { facingMode: isFrontCamera ? 'user' : 'environment' }, audio: false };
                currentStream = await navigator.mediaDevices.getUserMedia(videoOnlyConstraints);
                video.srcObject = currentStream;
                resolutionDisplay.innerText = "AUTO PREVIEW ACTIVE";
            }
        }

        // Photo Mode Core Logic (Canvas Capture)
        function takePhoto() {
            flashOverlay.style.animation = 'none';
            flashOverlay.offsetHeight; // force reflow
            flashOverlay.style.animation = 'flash-trigger 0.15s ease-out';
            playSound('photo');

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            if (isFrontCamera) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.filter = getComputedStyle(video).filter;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
            const a = document.createElement('a');
            a.download = `IMG_${Date.now()}.jpg`;
            a.href = dataUrl;
            a.click();
        }

        // Video Recording Controller Block
        function toggleVideoRecord() {
            if (!isRecording) {
                // Start Recording Sequence
                recordedChunks = [];
                
                // Use canvas streaming capture or directly stream fallback elements
                let options = { mimeType: 'video/webm;codecs=vp9' };
                if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                    options = { mimeType: 'video/webm' };
                }

                try {
                    mediaRecorder = new MediaRecorder(currentStream, options);
                } catch(e) {
                    mediaRecorder = new MediaRecorder(currentStream);
                }

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) recordedChunks.push(e.data);
                };

                mediaRecorder.onstop = () => {
                    const blob = new Blob(recordedChunks, { type: 'video/webm' });
                    const url = URL.createObjectURL(blob);
                    
                    // Direct automatic download deployment
                    const a = document.createElement('a');
                    a.download = `VID_${Date.now()}.webm`;
                    a.href = url;
                    a.click();
                };

                mediaRecorder.start();
                playSound('start');
                
                // HUD Timing Activation
                isRecording = true;
                triggerBtn.classList.add('recording');
                recIndicator.style.visibility = 'visible';
                startTime = Date.now();
                timerInterval = setInterval(updateTimer, 1000);
            } else {
                // Stop Recording Sequence
                mediaRecorder.stop();
                playSound('stop');
                
                isRecording = false;
                triggerBtn.classList.remove('recording');
                recIndicator.style.visibility = 'hidden';
                clearInterval(timerInterval);
                timestamp.innerText = "00:00";
            }
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
            const secs = String(elapsed % 60).padStart(2, '0');
            timestamp.innerText = `${mins}:${secs}`;
        }

        // Interaction Handling Wireframes
        triggerBtn.addEventListener('click', () => {
            if (currentMode === 'photo') {
                takePhoto();
            } else {
                toggleVideoRecord();
            }
        });

        modePhotoBtn.addEventListener('click', () => {
            if (isRecording) return;
            currentMode = 'photo';
            modePhotoBtn.classList.add('active');
            modeVideoBtn.classList.remove('active');
            triggerBtn.className = 'trigger-btn';
            hudFormat.innerText = 'RAW 14BIT';
            resolutionDisplay.innerText = `FHD ${video.videoWidth}x${video.videoHeight} [PHOTO]`;
        });

        modeVideoBtn.addEventListener('click', () => {
            currentMode = 'video';
            modeVideoBtn.classList.add('active');
            modePhotoBtn.classList.remove('active');
            triggerBtn.className = 'trigger-btn video-mode';
            hudFormat.innerText = 'MP4 / WEBM';
            resolutionDisplay.innerText = `FHD ${video.videoWidth}x${video.videoHeight} [VIDEO]`;
        });

        switchCamBtn.addEventListener('click', () => {
            if (isRecording) return;
            isFrontCamera = !isFrontCamera;
            initCamera();
        });

        gridToggleBtn.addEventListener('click', () => {
            const isVisible = gridLines.style.display !== 'none';
            gridLines.style.style = isVisible ? 'none' : 'block';
            gridLines.style.display = isVisible ? 'none' : 'block';
            gridToggleBtn.classList.toggle('active', !isVisible);
        });

        // Start App
        renderProfiles();
        initCamera();
    </script>
</body>
</html>
